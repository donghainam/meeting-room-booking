spring.application.name=meeting-room-booking
server.port=8082
app.timezone=Asia/Ho_Chi_Minh
spring.datasource.url=jdbc:h2:mem:booking
spring.jpa.hibernate.ddl-auto=create-drop
# Secret chỉ dùng khi dev (>= 32 byte); môi trường thật ghi đè bằng biến môi trường APP_JWT_SECRET
app.jwt.secret=dev-only-secret-change-me-0123456789abcdef
app.jwt.expires-in=3600
app.admin.password=admin
